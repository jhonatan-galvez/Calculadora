<!DOCTYPE html>
<html>
<head>
    <script src="https://unpkg.com/lucide@latest"></script>
    <meta name="viewport" content="user-scalable=no">
    <title>Calculadora de Notas </title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center; /* Centra todo horizontalmente */
            background-color: #717171;
            padding: 10px 20px;
        }

        h1 {
            color: #ffffff;
            font-size: 60px;
            font-weight: bold;
        }

        h2 {
            font-size: 60px;       /* 🔹 Cambia el tamaño del resultado */
            color: #ffffff;        /* 🔹 Cambia el color (puedes usar otro código o nombre) */
            font-weight: bold;     /* 🔹 Lo hace más grueso */
            margin-top: 40px;      /* 🔹 Separa un poco del texto superior */
        }

        /* Contenedor de botones */
        .botones {
        display: grid;
        grid-template-columns: 2fr 2fr 0.75fr;; /* 2 columnas */
        gap: 25px; /* espacio entre botones */
        justify-content: center;
        margin-bottom: 35px; /* espacio antes de los botones inferiores */
        }

        /* Contenedor inferior (Limpiar y Calcular) */
        .botones-inferiores {
            display: flex;
            margin-top: 50px;
            justify-content: center;
        }

        button {
            padding: 60px 25px; /* Aumenta tamaño de los botones */
            font-size: 65px;    /* Tamaño de letra más grande */
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25); /* 🔹 Sombra elegante */
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }

        /* Efecto moderno al presionar */
        button:active {
            transform: scale(0.95);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .borrar svg {
            width: 60px;
            height: 60px;
            stroke: white; /* color del ícono */
            font-size: 85px;
            stroke-width: 5.5; /* grosor de línea */
        }

        .calcular {
            background-color: #e2e2e3; 
            color: rgb(0, 0, 0); 
            padding: 50px 80px; /* altura interna pero no horizontal */
        }

        /* Colores por nota */
        .AD { background-color: #f68abf; color: black; }   /* Verde */
        .A  { background-color: #f68abf; color: black; }   /* Azul */
        .B  { background-color: #f68abf; color: black; }   /* Amarillo */
        .C  { background-color: #f68abf; color: black; }   /* Rojo */
        .limpiar { background-color: #414040; color: white; } /* Gris */
        .borrar {background-color: #000000; color: #ffffff}

        #notas-seleccionadas {
            margin-top: 50px;
            font-weight: bold;
            font-size: 50px;
        }

    </style>
</head>
<body>
    <h1>Calculadora 👸👑 </h1>

    <!-- Botones para agregar notas -->
    <div class="botones">
        <button type="button" class="AD" onclick="agregarNota('AD')">AD</button>
        <button type="button" class="A" onclick="agregarNota('A')">A</button>
        <button type="button" class="borrar" onclick="borrarNota()"><i data-lucide="arrow-left"></i></button>
        <button type="button" class="B" onclick="agregarNota('B')">B</button>
        <button type="button" class="C" onclick="agregarNota('C')">C</button>
         <button type="button" class="limpiar" onclick="limpiarNotas()">CLR</button>
    </div>

    <!-- Nueva fila para limpiar y calcular -->
    <div class="botones-inferiores">
        <button type="submit" form="form-notas" class="calcular">  Calcular  </button>
    </div>


    <!-- Formulario para enviar las notas al backend -->
    <form method="POST" id="form-notas">
        <div id="inputs-notas"></div>
    </form>

    <!-- Mostrar notas seleccionadas -->
    <div id="notas-seleccionadas">
        Notas seleccionadas:
        {% if notas %}
            {{ notas | join(" ") }}
        {% endif %}
    </div>

    <!-- Mostrar resultado -->

<h2>{{ resultado|safe }}</h2>

    <script>
        function agregarNota(nota) {
            document.querySelector("h2").textContent = "";
            const input = document.createElement("input");
            input.type = "hidden";
            input.name = "nota";
            input.value = nota;
            document.getElementById("inputs-notas").appendChild(input);

            
            const inputs = document.querySelectorAll("#inputs-notas input");
            const notas = Array.from(inputs).map(i => i.value);
            document.getElementById("notas-seleccionadas").textContent =
                "Notas seleccionadas: " + notas.join(" ");
        }

        function limpiarNotas() {
            document.getElementById("inputs-notas").innerHTML = "";
            document.getElementById("notas-seleccionadas").textContent = "Notas seleccionadas: ";
            document.querySelector("h2").textContent = "";
        }
        function borrarNota() {
            const inputs = document.querySelectorAll("#inputs-notas input");
            if (inputs.length > 0) {
                inputs[inputs.length - 1].remove();
            }

            const restantes = Array.from(document.querySelectorAll("#inputs-notas input")).map(i => i.value);
            document.getElementById("notas-seleccionadas").textContent =
                "Notas seleccionadas: " + restantes.join(" ");
        }
        // 🔹 Inicializa los íconos Lucide al cargar
        lucide.createIcons();
    </script>
</body>
</html>
